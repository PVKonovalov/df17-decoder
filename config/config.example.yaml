# df17-decoder configuration. Every key is optional; the values below are the built-in defaults.
# Unknown keys are rejected. Durations are Go duration strings: 500ms, 10s, 1m30s.
# CLI flags (-config, -log-level) override this file.

source:
  # Where raw frames come from:
  #   beast://host:30005  dump1090 Beast binary output, with signal levels (RSSI); preferred
  #   tcp://host:30002    dump1090 raw AVR output (*hex; or @timestamp+hex;), no signal levels
  #   file://path         a recorded capture for offline replay: Beast binary or AVR text, detected from the file
  url: beast://localhost:30005
  # Reconnect backoff: starts at reconnectMin, doubles after each failure, capped at reconnectMax.
  reconnectMin: 1s
  reconnectMax: 30s
  # file:// only. Playback speed relative to the @-timestamps in the file; 0 = as fast as possible.
  # Lines without a timestamp (*hex;) are always replayed without delay.
  replaySpeed: 1.0

receiver:
  # Receiver position: decimal degrees (25.07) or AIP DMS (250412.00N, 0225218.00E).
  # Reference for local CPR decoding and distance/bearing.
  lat: 25.07
  lon: 22.87
  # Positions farther than this from the receiver are rejected as bogus.
  maxRangeNm: 300

decoder:
  # Repair a single flipped bit in DF17 frames using the CRC. Off by default (small false-positive risk).
  fixSingleBitErrors: false
  # Maximum age difference between an even and an odd CPR frame for a global position decode.
  cprPairMaxAge: 10s

tracker:
  # Forget an aircraft after this long without messages.
  ttl: 60s
  # How long an address seen in a valid DF11/17/18 is trusted for address/parity replies (DF0/4/5/16/20/21).
  knownAddressTTL: 60s

trails:
  # Length of each aircraft's trail kept in memory and sent to the UI (data time).
  window: 10m
  # Minimum time between kept track points on a straight, level leg.
  minInterval: 5s

history:
  # Write flights and thinned track points to an SQLite database.
  enabled: false
  # Relative to the working directory (the state dir under systemd); Docker: /var/lib/df17-decoder/history.db
  # The directory must exist and be writable when enabled, or the service refuses to start (exit code 2).
  file: history.db
  # Batch interval for database writes.
  flushInterval: 15s
  # A gap longer than this after an aircraft expires closes its flight.
  flightGap: 10m
  # Flights older than this are deleted hourly; 0 keeps everything.
  retention: 720h


tape:
  # Record every received frame to compressed hourly segments for playback.
  enabled: true
  # Relative to the working directory (the state dir under systemd); Docker: /var/lib/df17-decoder/tape
  # Must be writable when enabled, or the service refuses to start (exit code 2).
  dir: tape
  # Segment length; must divide a day evenly (10m, 15m, 30m, 1h, 2h, ...).
  segment: 1h
  # Crash safety: at most this much recording is lost on a crash.
  flushInterval: 5s
  # Segments older than this are deleted hourly; 0 keeps everything (the disk guard still applies).
  retention: 336h
  # The oldest segments are deleted, then recording pauses, when free space drops below this.
  minFreeMB: 1024

playback:
  # Concurrent tape playback sessions (one per browser tab in playback); 0 disables playback.
  maxSessions: 4
  # A session paused this long frees its memory; pressing play again rebuilds it. 0: never.
  idleTimeout: 30m

stats:
  # Hourly rollups (aircraft per hour, countries, operators, range) need history.enabled.
  # They are kept this long, independently of history.retention; 0 keeps them forever.
  retention: 8760h
  # Days of the daily aircraft totals ("Aircraft per day", "new to us") as an IANA name, e.g. Europe/Berlin.
  # Empty uses the server's local zone, which is often UTC under systemd or Docker: better set it.
  timezone: ""

api:
  # HTTP listen address.
  listen: ":8080"
  # Interval between snapshots pushed on /api/stream.
  streamInterval: 1s

map:
  # Web UI map tiles: any XYZ tile server, e.g. a self-hosted one on your LAN (then the map works offline).
  # {s} (subdomain) is also supported. The browser loads the tiles, so the URL must be reachable from it.
  tileUrl: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  # Shown in the map corner; most tile providers require it. HTML is allowed.
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  maxZoom: 19
  # Invert the tiles in dark mode (OSM has no dark style). Set false if your tiles are already dark.
  darkFilter: true

  # Named navigation fixes drawn on the map (below the traffic), in live and playback. Each entry:
  #   name   1-12 characters, unique (case-insensitive); the label
  #   lat    AIP DMS DDMMSS[.s]N|S (250412.00N, 250412N) or decimal degrees (25.07, -0.5)
  #   lon    AIP DMS DDDMMSS[.s]E|W (0225218.00E) or decimal degrees (22.87); 3 degree digits in DMS
  #   icon   triangle (default) | triangleOpen | star | diamond | circle | circleOpen | square | hexagon |
  #          cross | flag; case-insensitive
  #   color  optional #rgb or #rrggbb; default: a theme color readable on light and dark tiles
  #   note   optional text for the tooltip
  # Fictional example near the placeholder receiver:
  #   waypoints:
  #     - name: ALPHA
  #       lat: 250412.00N
  #       lon: 0225218.00E
  #       icon: star
  #     - name: BRAVO
  #       lat: 25.12
  #       lon: 22.95
  #       icon: diamond
  #       note: fictional fix
  # Keep real waypoints only in a gitignored file (config/config.yaml, config/waypoints*.yaml): they reveal
  # where the receiver is.
  waypoints: []
  # Optional YAML file with more waypoints in the same list format (no "waypoints:" key, just the list),
  # merged with the list above; names must be unique across both. Relative to this file's directory.
  waypointsFile: ""
  # Waypoint names are shown from this zoom level up; below it only the symbols.
  waypointLabelMinZoom: 9

coverage:
  # JSON file that keeps the range outline (furthest position per 2° of bearing) across restarts. It is saved
  # every minute and on shutdown, and discarded when receiver.lat/lon change. Empty: kept in memory only.
  # A relative path is relative to the working directory, which the systemd unit sets to /var/lib/df17-decoder.
  # The directory must exist and be writable, or the service refuses to start (exit code 2).
  # Docker: /var/lib/df17-decoder/coverage.json (the df17-state volume).
  file: ""

log:
  level: info    # debug|info|warn|error
  format: text   # text|json
